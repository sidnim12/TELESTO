<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112e58" />
    <meta
      name="description"
      content="TELESTO research observatory. Explore reproducible fermentation simulations and the path to scale-adaptive biological manufacturing."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TELESTO — Research observatory</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("telesto-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
