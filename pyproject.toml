[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biocontrolos"
version = "0.0.1"
description = "Process-agnostic autonomy research platform for biological manufacturing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
